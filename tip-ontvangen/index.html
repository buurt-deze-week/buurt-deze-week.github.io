<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Tip ontvangen · Buurt deze week</title>
  <style>
    :root{
      --bg:#f6f2e9;
      --text:#132130;
      --muted:#596575;
      --blue:#1267f4;
      --line:#d8d2c7;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    .wrap{
      width:min(760px,calc(100% - 32px));
      margin:0 auto;
      padding:46px 0 38px;
    }
    .brand{
      font-size:.88rem;
      font-weight:800;
      color:var(--blue);
      margin-bottom:42px;
    }
    .card{
      border-top:1px solid var(--line);
      padding-top:34px;
    }
    h1{
      margin:0;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(2.5rem,8vw,4rem);
      line-height:.98;
      letter-spacing:-.045em;
    }
    .dot{color:var(--blue)}
    p{
      max-width:620px;
      font-size:1.08rem;
      line-height:1.6;
      color:#45515d;
    }
    .button{
      display:inline-block;
      margin-top:18px;
      padding:12px 18px;
      border-radius:999px;
      background:var(--blue);
      color:#fff;
      text-decoration:none;
      font-weight:800;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">Buurt deze week · Zuidoost-Enschede</div>
    <section class="card">
      <h1>Bedankt voor je tip<span class="dot">.</span></h1>
      <p>We hebben je tip ontvangen en bekijken of hij past in een volgende editie van Buurt deze week.</p>
      <a class="button" href="/">Terug naar de nieuwste editie</a>
    </section>
  </main>

  <script>
    window.sa_event=window.sa_event||function(){
      var a=[].slice.call(arguments);
      window.sa_event.q?window.sa_event.q.push(a):window.sa_event.q=[a];
    };
    document.addEventListener('DOMContentLoaded', function () {
      sa_event('tip_thankyou_viewed');
    });
  </script>
  <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
</body>
</html>
