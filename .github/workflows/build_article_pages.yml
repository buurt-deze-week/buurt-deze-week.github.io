name: Bouw en archiveer editie

on:
  push:
    branches:
      - main
    paths:
      - "editie.json"
      - "scripts/build_article_pages.py"
      - "scripts/build_edition_archive.py"
      - ".github/workflows/build_article_pages.yml"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: buurt-publicatie
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tussenpagina's en afbeeldingen bouwen
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python scripts/build_article_pages.py

      - name: Editiepagina’s en archief bouwen
        run: python scripts/build_edition_archive.py

      - name: Gegenereerde bestanden committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add editie-site.json berichten/ assets/berichten/ edities/

          if git diff --cached --quiet; then
            echo "Geen wijzigingen om te committen."
            exit 0
          fi

          git commit -m "Genereer artikelpagina's en Pixabay-afbeeldingen"

          for attempt in 1 2 3; do
            echo "Pushpoging $attempt..."
            git pull --rebase origin main

            if git push origin HEAD:main; then
              exit 0
            fi

            sleep 3
          done

          echo "Push is na 3 pogingen niet gelukt."
          exit 1
