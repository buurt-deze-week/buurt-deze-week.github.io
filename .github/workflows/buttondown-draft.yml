name: Buttondown draft maken

on:
  workflow_run:
    workflows: ["Bouw en archiveer editie"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "scripts/buttondown_draft.py"
      - ".github/workflows/buttondown-draft.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buttondown-editie
  cancel-in-progress: false

jobs:
  draft:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Laatste gegenereerde editie ophalen
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Benodigdheden installeren
        run: pip install requests

      - name: Buttondown-draft met siteafbeeldingen bijwerken
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python scripts/buttondown_draft.py --edition editie-site.json --source-edition editie.json
